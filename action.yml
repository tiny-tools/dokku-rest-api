name: Dokku REST API
description: Deploy, scale, restart and configure Dokku apps through the dokku-api plugin, without SSH keys or secrets
author: tiny-tools
branding:
  icon: upload-cloud
  color: blue

inputs:
  dokku_url:
    description: Base URL of the API, e.g. https://api.dokku.example.com
    required: true
  api_token:
    description: >
      API token created with `dokku api:token-create` (store it as a secret). Leave it out to sign in
      as this workflow run via GitHub OIDC instead (needs `permissions: id-token: write` and a
      `dokku api:trust-github` on the server).
    required: false
  audience:
    description: Audience of the GitHub OIDC token; defaults to the origin of dokku_url, which is what api:setup expects
    required: false
  app_name:
    description: Target app
    required: false
  config:
    description: Environment variables to set, one KEY=value per line
    required: false
  config_restart:
    description: Restart the app after setting config (skipped automatically when a deploy follows)
    required: false
    default: "true"
  deploy_image:
    description: Docker image to deploy (uses git:from-image)
    required: false
  deploy_repository:
    description: Git repository (https:// or git@) to sync and build (uses git:sync --build)
    required: false
  deploy_ref:
    description: Branch, tag or commit for deploy_repository
    required: false
  deploy_retries:
    description: >
      Extra attempts when the deploy fails in Dokku or on the way (HTTP 422, 5xx, network error),
      e.g. when two builds on one server get in each other's way. Not for 4xx errors or client timeouts.
    required: false
    default: "0"
  deploy_retry_delay:
    description: Seconds to wait before each deploy retry
    required: false
    default: "60"
  rebuild:
    description: Rebuild and redeploy the current app source (ps:rebuild)
    required: false
    default: "false"
  scale:
    description: Process formation, e.g. "web=2 worker=1"
    required: false
  restart:
    description: Restart the app
    required: false
    default: "false"
  cli_commands:
    description: >
      Allow-listed dokku commands, one JSON array per line, e.g. ["ps:scale", "web=2"].
      The app from app_name is inserted automatically. A JSON object line is sent as-is to POST /api/v1/cli.
    required: false
  health_check_url:
    description: >
      Optional URL the app answers on (e.g. https://shop.example.com/health). After all other steps, the
      action polls it until it returns 2xx. Leave it out for apps without a health endpoint.
    required: false
  health_check_contains:
    description: Text the health check's response must contain, e.g. ${{ github.sha }} when the endpoint reports the version
    required: false
  health_check_timeout:
    description: Seconds to wait for the app to become healthy
    required: false
    default: "120"
  timeout_seconds:
    description: Timeout per API request in seconds; a synchronous deploy may take this long
    required: false
    default: "900"

outputs:
  results:
    description: JSON array with the result of every step
  status:
    description: App status JSON (only when no action input was given)
  stdout:
    description: stdout of the last cli_commands entry

runs:
  using: node24
  main: dist/action/main.js
