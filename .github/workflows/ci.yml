name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/ is up to date
        run: git diff --exit-code -- dist
      - name: shellcheck
        run: shellcheck -x -e SC1091 install uninstall commands post-deploy bin/dokku-api subcommands/*
