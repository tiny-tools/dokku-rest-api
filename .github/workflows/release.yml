name: Release

# After CI passes on main: if package.json has a version without a tag yet,
# tag that commit v<version>, move the major tag (v1) that `uses:` refers to,
# and publish a GitHub release. Bump the version (package.json, plugin.toml,
# VERSION in src/server.ts) to release; any other push to main does nothing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          major="v${version%%.*}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to release"
            exit 0
          fi
          git tag "$tag" "$SHA"
          git push origin "refs/tags/$tag"
          git tag -f "$major" "$SHA"
          git push -f origin "refs/tags/$major"
          gh release create "$tag" --verify-tag --title "$tag" --generate-notes --latest
